[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/probe",
    "crates/pipeline",
    "crates/cli",
    "xtask",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
cudarc = { version = "0.16", default-features = false, features = ["std", "driver", "dynamic-loading", "cuda-12090"] }
fastconv-domain = { path = "crates/domain" }
fastconv-probe = { path = "crates/probe" }
fastconv-pipeline = { path = "crates/pipeline" }
jpeg-encoder = { version = "0.7.1", features = ["std", "simd"] }
nvidia-video-codec-sdk = "0.4"
png = "0.18"
pollster = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "30", default-features = false, features = ["std", "vulkan", "metal", "dx12"] }
zenwebp = { version = "0.4", default-features = false, features = ["std", "fast-yuv"] }
zune-jpeg = "0.5.15"

[profile.release]
lto = "thin"

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.zenwebp]
opt-level = 3

[profile.dev.package.zenyuv]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.jpeg-encoder]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
