[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/probe",
    "crates/pipeline",
    "crates/cli",
    "xtask",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "AGPL-3.0-only"

[workspace.dependencies]
alac-encoder = "0.3.0"
containr = { version = "0.1.1", features = ["mp4", "mkv"] }
cudarc = { version = "0.16", default-features = false, features = ["std", "driver", "dynamic-loading", "cuda-12090"] }
fastconv-domain = { path = "crates/domain" }
fastconv-probe = { path = "crates/probe" }
fastconv-pipeline = { path = "crates/pipeline" }
flacenc = { version = "0.5.1", default-features = false }
# Pure-Rust HEIC/HEIF encoder (`MIT OR Apache-2.0`, MSRV 1.85, `#![forbid(unsafe_code)]`).
# `default-features = false` keeps the optional `image` crate out of the dependency tree.
heifer = { version = "0.7.3", default-features = false, features = ["encoder"] }
hound = "3.5.1"
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
# JPEG XL decode is the pure-Rust `jxl` (jxl-rs) port; encode is the pure-Rust
jxl = "0.8.0"
# `jixel` is the pure-Rust JPEG XL encoder used for JXL output.
# It is dual-licensed BSD-3-Clause OR Apache-2.0.
jixel = { version = "0.5.13", default-features = false, features = ["avx", "sse"] }
libloading = "0.9"
nvidia-video-codec-sdk = "0.4"
ogg = "0.9.2"
opus-pure = "0.2.5"
png = { version = "0.18", features = ["zlib-rs"] }
rubato = "5.1.0"
# Pure-Rust video codecs for native transcoding (no C/FFI, AGPL-compatible licenses).
rav1d-safe = "0.5.7"
rusty_h264 = "0.17.4"
rusty_h265 = "0.7.3"
rusty_vp9 = "0.3.0"
# Direct AVIF pipeline: avif-serialize (BSD-3-Clause) writes ISOBMFF boxes and
# rav1e (BSD-2-Clause) encodes AV1 frames. flate2 stays zlib-rs based via png/tiff.
avif-serialize = "0.8.9"
rav1e = { version = "0.8.1", default-features = false, features = ["asm", "threading"] }
rusty_aac = "2.3.0"
rusty_mp3 = "1.2.2"
gif = "0.14.2"
ico = "0.6.0"
# AVIF decode: zenavif default features use the pure safe Rust rav1d-safe decoder
# (AGPL-3.0-only OR LicenseRef-Imazen-Commercial); zenavif-parse parses ISOBMFF boxes (MPL-2.0).
zenavif = "0.1.6"
zenavif-parse = "0.6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6.1", default-features = false, features = ["opt-simd", "pcm", "wav", "aiff", "flac", "vorbis", "mp3", "ogg", "aac", "alac", "isomp4", "id3v2"] }
tiff = { version = "0.11.3", default-features = false, features = ["deflate", "lzw"] }
vorbis-enc = "0.1.1"
# SIMD RGB/RGBA -> YUV420/NV12 conversion (BSD-3-Clause OR Apache-2.0).
yuv = "0.8.21"
zenwebp = { version = "0.4.6", default-features = false, features = ["std"] }
# Pin 0.5.16-rc3 until stable 0.5.16 ships: fixes silent wrong-color decoding in 0.5.15 (zune-image#496).
zune-jpeg = "0.5.16-rc3"

[profile.release]
lto = "thin"

[profile.dev.package.alac-encoder]
opt-level = 3

# HEVC intra encoding is CPU-bound; keep debug-profile tests fast without
# changing the encoder's fair Medium speed/quality preset.
[profile.dev.package.heifer]
opt-level = 3

[profile.dev.package.heifer-hevc-enc]
opt-level = 3

[profile.dev.package.heifer-hevc-dec]
opt-level = 3

[profile.dev.package.heifer-isobmff]
opt-level = 3

[profile.dev.package.rusty_aac]
opt-level = 3

[profile.dev.package.rusty_mp3]
opt-level = 3

[profile.dev.package.vorbis-enc]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.zenwebp]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.jpeg-encoder]
opt-level = 3

[profile.dev.package.jxl]
opt-level = 3


[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.rav1e]
opt-level = 3

[profile.dev.package.tiff]
opt-level = 3

[profile.dev.package.rav1d-safe]
opt-level = 3

[profile.dev.package.rusty_h264]
opt-level = 3

[profile.dev.package.rusty_h264-decoder]
opt-level = 3

[profile.dev.package.rusty_h264-encoder]
opt-level = 3

[profile.dev.package.rusty_h264-common]
opt-level = 3

[profile.dev.package.rusty_h265]
opt-level = 3

[profile.dev.package.rusty_h265-accel]
opt-level = 3

[profile.dev.package.rusty_vp9]
opt-level = 3

[profile.dev.package.zenavif]
opt-level = 3

[profile.dev.package.yuv]
opt-level = 3

[profile.dev.package.gif]
opt-level = 3

[profile.dev.package.color_quant]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
