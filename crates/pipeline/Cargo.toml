[package]
name = "fastconv-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
nvenc = ["dep:cudarc", "dep:nvidia-video-codec-sdk"]

[dependencies]
alac-encoder.workspace = true
cudarc = { workspace = true, optional = true }
fastconv-domain.workspace = true
containr.workspace = true
flacenc = { workspace = true, features = ["par"] }
hound.workspace = true
jpeg-encoder.workspace = true
jxl.workspace = true
jixel.workspace = true
nvidia-video-codec-sdk = { workspace = true, optional = true }
opus-pure.workspace = true
png.workspace = true
rubato.workspace = true
rusty_aac.workspace = true
rusty_mp3.workspace = true
symphonia.workspace = true
avif-serialize.workspace = true
flate2.workspace = true
gif.workspace = true
ico.workspace = true
rav1e.workspace = true
rav1d-safe.workspace = true
rusty_h264.workspace = true
rusty_h265.workspace = true
rusty_vp9.workspace = true
tiff.workspace = true
vorbis-enc.workspace = true
zenavif.workspace = true
zenavif-parse.workspace = true
zenwebp.workspace = true
zune-jpeg.workspace = true

[lints.rust]
# Default builds enforce `#![forbid(unsafe_code)]` via `src/lib.rs`.
# Only the optional `nvenc` FFI boundary uses narrowly scoped `unsafe` blocks.
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
